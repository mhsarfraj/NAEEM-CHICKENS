<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Admin — NAEEM CHICKENS LABDAHA</title>
<meta name="theme-color" content="#1f2a24">
<link rel="icon" href="assets/images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="admin">
<div id="login" class="login-wrap" hidden>
  <form id="lf" class="card login-card" novalidate>
    <img src="assets/images/logo.svg" alt="" width="64" height="64">
    <h1>Admin sign in</h1><p class="hint">NAEEM CHICKENS LABDAHA</p>
    <div id="lmsg"></div>
    <div class="field"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="off" required></div>
    <div class="field"><label for="p">Password</label><div class="password-control"><input id="p" type="password" autocomplete="current-password" required><button class="password-toggle" type="button" id="togglePassword" aria-controls="p" aria-pressed="false">Show</button></div></div>
    <button class="btn primary" id="lgo" type="submit" style="width:100%">Sign in</button>
    <p class="hint" style="margin-top:12px">Sessions end after 6 hours or when you sign out. Never share your password.</p>
  </form>
</div>
<div id="app" hidden>
  <header class="a-top"><button class="btn sm light" id="menu" aria-label="Menu" aria-expanded="false">☰</button><strong class="a-title">NAEEM CHICKENS · Admin</strong>
    <span class="pill loading" id="shopPill">…</span><span class="sync" id="sync" role="status">Not synced</span>
    <button class="btn sm light" id="refresh" title="Refresh">↻</button><span class="who" id="who"></span><button class="btn sm ghost" id="chpw" style="color:#fff">Password</button><button class="btn sm ghost" id="logout" style="color:#fff">Sign out</button></header>
  <div class="a-body"><nav class="a-nav" id="nav" aria-label="Admin sections"></nav><main class="a-main" id="view" tabindex="-1"></main></div>
</div>
<div id="boot" class="empty"><span class="spinner dark"></span></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/reports.js"></script>
<script src="assets/js/admin-sections.js"></script>
<script src="assets/js/admin.js"></script>

<script>
(function(){var b=document.getElementById('togglePassword'),p=document.getElementById('p');if(!b||!p)return;b.addEventListener('click',function(){var show=p.type==='password';p.type=show?'text':'password';b.textContent=show?'Hide':'Show';b.setAttribute('aria-pressed',String(show));p.focus();});})();
</script>
</body>
</html>
